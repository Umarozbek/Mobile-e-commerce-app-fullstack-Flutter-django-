{% extends "base.html" %}
{% block content %}
<div class="pagetitle d-flex justify-content-between align-items-center mb-4">
    <h1 style="font-weight: 700; color: #012970;">Bank kartalari ro'yxati</h1>
    <a href="{% url 'bank-card-create' %}" class="btn btn-success rounded-pill px-4 shadow-sm">
        <i class="bi bi-plus-lg me-1"></i> Yangi karta qo'shish
    </a>
</div>

<div class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="card-body p-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
                <tr>
                    <th class="text-center py-3">#</th>
                    <th class="py-3">Karta raqami</th>
                    <th class="py-3">Karta egasi</th>
                    <th class="text-center py-3">Amallar</th>
                </tr>
            </thead>
            <tbody>
                {% for card in cards %}
                <tr>
                    <td class="text-center fw-bold text-muted">{{ forloop.counter }}</td>
                    <td class="fw-bold text-dark fs-6">{{ card.title }}</td>
                    <td>{{ card.card_holder }}</td>
                    <td class="text-center">
                        <a href="{% url 'bank-card-edit' card.id %}" class="btn btn-sm btn-outline-primary rounded-circle me-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form action="{% url 'bank-card-delete' card.id %}" method="POST" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle" onclick="return confirm('Haqiqatdan ham o\'chirmoqchimisiz?')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center py-5 text-muted fst-italic">Kartalar mavjud emas.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
